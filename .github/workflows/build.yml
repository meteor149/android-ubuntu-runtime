name: Android library
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Restore runtime artifacts
        id: runtime-cache
        uses: actions/cache@v6
        with:
          path: runtime/dist
          key: runtime-${{ runner.os }}-${{ hashFiles('runtime/proot/**', 'runtime/versions.env', 'tools/generate-runtime-manifest.mjs') }}
      - name: Build pinned runtime artifacts
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: ./gradlew buildRuntime --no-configuration-cache
      - name: Verify manifest generator
        run: node --test tools/generate-runtime-manifest.test.mjs
      - name: Build artifacts, verify and publish to a local Maven repository
        run: |
          ./gradlew testDebugUnitTest publish
      - uses: actions/upload-artifact@v7
        with:
          name: android-ubuntu-runtime-maven
          path: build/maven-repository
          if-no-files-found: error
